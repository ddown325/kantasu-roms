<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantasu-Roms - Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0d0d0d; --bg-secondary: #1a1a1a; --accent: #9370db;
            --text-primary: #ffffff; --text-secondary: #8a8a8a; --border: #2a2a2a;
        }
        html, body { height: 100%; overflow: hidden; }
        body {
            background: var(--bg-primary); font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-primary); -webkit-font-smoothing: antialiased;
            display: flex; flex-direction: column;
        }
        .nav { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 0 24px; height: 50px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .back-btn { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .back-btn:hover { color: #b06fd3; }
        .game-name { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
        .perf-badge { background: rgba(147, 112, 219, 0.15); border: 1px solid rgba(147, 112, 219, 0.4); color: var(--accent); padding: 3px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        #game-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; overflow: hidden; }
        #game { width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="nav-left">
            <a href="index.html" class="back-btn">&#8592; Back</a>
            <div class="game-name" id="game-name">Loading...</div>
        </div>
        <div class="perf-badge">Max Performance</div>
    </div>
    <div id="game-container">
        <div id="game"></div>
    </div>
    <script type="text/javascript">
        // ===== INDEXEDDB (for user-uploaded ROMs) =====
        const DB_NAME = 'kantasu_roms_db';
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('games')) database.createObjectStore('games', { keyPath: 'id' });
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function dbGet(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(['games'], 'readonly');
                const req = tx.objectStore('games').get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // ===== CACHE CLEAR =====
        function nukeCaches() {
            return new Promise((resolve) => {
                const dbsToDelete = [
                    'EmulatorJS-roms', 'EmulatorJS-bios', 'EmulatorJS-core', 'EmulatorJS-states'
                ];
                let pending = dbsToDelete.length;
                if (pending === 0) { resolve(); return; }
                for (const dbName of dbsToDelete) {
                    try {
                        const req = indexedDB.deleteDatabase(dbName);
                        req.onsuccess = () => { if (--pending === 0) resolve(); };
                        req.onerror = () => { if (--pending === 0) resolve(); };
                        req.onblocked = () => { setTimeout(() => { if (--pending === 0) resolve(); }, 500); };
                    } catch(e) { if (--pending === 0) resolve(); }
                }
                setTimeout(resolve, 2000);
            });
        }

        // ===== MAIN LOADING LOGIC =====
        async function loadGame() {
            var params = new URLSearchParams(window.location.search);
            var romUrl = '';
            var gameName = '';
            var userGameId = params.get('usergame');

            if (userGameId) {
                try {
                    await openDB();
                    var gameRecord = await dbGet(userGameId);
                    if (gameRecord && gameRecord.romBlob) {
                        romUrl = URL.createObjectURL(gameRecord.romBlob);
                        gameName = gameRecord.title || 'Game';
                    } else {
                        alert('Game not found in storage!');
                        window.location.href = 'index.html';
                        return;
                    }
                    db.close();
                } catch (err) {
                    alert('Error loading game: ' + err.message);
                    window.location.href = 'index.html';
                    return;
                }
            } else {
                romUrl = params.get('rom') || '';
                gameName = params.get('name') || 'Game';
                if (romUrl && !romUrl.match(/^https?:\/\//)) {
                    romUrl = new URL(romUrl, window.location.href).href;
                }
            }

            document.getElementById('game-name').textContent = gameName;

            // Clear old caches
            await nukeCaches();

            // Determine game type for custom controls
            var gameLower = gameName.toLowerCase();
            var isSM64 = gameLower.includes('mario 64') || gameLower.includes('sm64') || gameLower.includes('super mario');
            var isBanjo = gameLower.includes('banjo');
            var isZelda = gameLower.includes('zelda') || gameLower.includes('ocarina') || gameLower.includes('majora');

            // ===== DEFAULT CONTROLLER MAPPINGS =====
            // Format: EJS_defaultControls[playerNum] = { 0: { code: keycode, name: 'key name' }, ... }
            // Button IDs: 0=A, 1=B, 2=Select, 3=Start, 4=Up, 5=Down, 6=Left, 7=Right,
            //             8=A(2), 9=B(2), 10=L, 11=R, 12=C-Up, 13=C-Down, 14=C-Left, 15=C-Right

            if (isSM64) {
                // SM64 Controls:
                // A Button (Jump): C
                // B Button (Punch/Attack): X
                // Z Trigger (Crouch/Ground Pound): Z
                // Movement: WASD
                // Camera (C-Buttons): IJKL
                // Start: Enter
                EJS_defaultControls = {
                    0: {
                        0: { code: 'KeyC', name: 'C' },           // A = C (Jump)
                        1: { code: 'KeyX', name: 'X' },           // B = X (Punch/Attack)
                        2: { code: 'KeyZ', name: 'Z' },           // Z = Z (Crouch/Ground Pound)
                        3: { code: 'Enter', name: 'Enter' },      // Start
                        4: { code: 'KeyW', name: 'W' },           // Up
                        5: { code: 'KeyS', name: 'S' },           // Down
                        6: { code: 'KeyA', name: 'A' },           // Left
                        7: { code: 'KeyD', name: 'D' },           // Right
                        12: { code: 'KeyI', name: 'I' },          // C-Up
                        13: { code: 'KeyK', name: 'K' },          // C-Down
                        14: { code: 'KeyJ', name: 'J' },          // C-Left
                        15: { code: 'KeyL', name: 'L' }           // C-Right
                    }
                };
            } else if (isBanjo) {
                // Banjo-Kazooie Controls:
                // A Button (Jump): Z
                // B Button (Attack/Hit): X
                // Z Trigger (Crouch/Roll): C
                // Movement: WASD
                // C-Buttons (Camera/Eggs): IJKL
                // L/R: Q and E
                // Start: Enter
                EJS_defaultControls = {
                    0: {
                        0: { code: 'KeyZ', name: 'Z' },           // A = Z (Jump)
                        1: { code: 'KeyX', name: 'X' },           // B = X (Attack)
                        2: { code: 'KeyC', name: 'C' },           // Z = C (Crouch/Roll)
                        3: { code: 'Enter', name: 'Enter' },      // Start
                        4: { code: 'KeyW', name: 'W' },           // Up
                        5: { code: 'KeyS', name: 'S' },           // Down
                        6: { code: 'KeyA', name: 'A' },           // Left
                        7: { code: 'KeyD', name: 'D' },           // Right
                        10: { code: 'KeyQ', name: 'Q' },          // L
                        11: { code: 'KeyE', name: 'E' },          // R
                        12: { code: 'KeyI', name: 'I' },          // C-Up
                        13: { code: 'KeyK', name: 'K' },          // C-Down
                        14: { code: 'KeyJ', name: 'J' },          // C-Left
                        15: { code: 'KeyL', name: 'L' }           // C-Right
                    }
                };
            } else if (isZelda) {
                // Zelda Controls:
                // A Button (Action/Talk/Confirm): Z
                // B Button (Sword/Attack): X
                // Z-Targeting (Shield/Lock-on): C or Left Shift
                // Movement: WASD or Arrow Keys
                // C-Left/Right/Down: A, S, D
                // C-Up (First-Person/Navi): W or E
                // Start: Enter or Spacebar
                EJS_defaultControls = {
                    0: {
                        0: { code: 'KeyZ', name: 'Z' },           // A = Z (Action/Talk)
                        1: { code: 'KeyX', name: 'X' },           // B = X (Sword/Attack)
                        2: { code: 'ShiftLeft', name: 'Left Shift' }, // Z-Target = Left Shift
                        3: { code: 'Enter', name: 'Enter' },      // Start = Enter
                        4: { code: 'ArrowUp', name: 'Up Arrow' }, // Up
                        5: { code: 'ArrowDown', name: 'Down Arrow' }, // Down
                        6: { code: 'ArrowLeft', name: 'Left Arrow' }, // Left
                        7: { code: 'ArrowRight', name: 'Right Arrow' }, // Right
                        12: { code: 'KeyW', name: 'W' },          // C-Up (Navi/First Person)
                        13: { code: 'KeyD', name: 'D' },          // C-Down
                        14: { code: 'KeyA', name: 'A' },          // C-Left
                        15: { code: 'KeyS', name: 'S' }           // C-Right
                    }
                };
            }

            // ===== EMULATOR CONFIG =====
            EJS_player = '#game';
            EJS_core = 'mupen64plus_next';
            EJS_gameUrl = romUrl;
            EJS_gameName = gameName;
            EJS_pathtodata = 'data/';
            EJS_startOnLoaded = true;
            EJS_volume = 1;
            EJS_AdUrl = '';
            EJS_color = '#9370db';
            EJS_disableAutoLang = true;
            EJS_language = 'en-US';

            // ENABLE local save data (auto-saves to IndexedDB)
            EJS_CacheLimit = 524288000; // 500MB cache for ROMs + saves
            EJS_disableLocalStorage = false;

            // Disable cheats entirely (prevents memory access out of bounds crash)
            EJS_cheats = [];

            // Performance options
            EJS_defaultOptions = {
                'mupen64plus-next-gfxplugin': 'GlideN64',
                'mupen64plus-next-screensize': '320x240',
                'mupen64plus-next-aspect': '4:3',
                'mupen64plus-next-frame-skip': '3',
                'mupen64plus-next-enable-fog': 'disabled',
                'mupen64plus-next-enable-screenshot': 'disabled',
                'mupen64plus-next-filtering': 'disabled',
                'mupen64plus-next-enable-depth': 'disabled',
                'mupen64plus-next-audio-buffer-size': '2048',
                'mupen64plus-next-rsp-plugin': 'HLE',
                'mupen64plus-next-cache-textures': 'disabled'
            };

            EJS_debug = false;

            // Load emulator with cache-busting
            var script = document.createElement('script');
            script.src = 'data/loader.js?v=' + Date.now();
            document.body.appendChild(script);
        }

        loadGame();
    </script>
</body>
</html>
