<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantasu-Roms - Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0d0d0d; --bg-secondary: #1a1a1a; --accent: #9370db;
            --text-primary: #ffffff; --text-secondary: #8a8a8a; --border: #2a2a2a;
        }
        html, body { height: 100%; overflow: hidden; }
        body {
            background: var(--bg-primary); font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-primary); -webkit-font-smoothing: antialiased;
            display: flex; flex-direction: column;
        }
        .nav { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 0 24px; height: 50px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .back-btn { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .back-btn:hover { color: #b06fd3; }
        .game-name { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
        .perf-badge { background: rgba(147, 112, 219, 0.15); border: 1px solid rgba(147, 112, 219, 0.4); color: var(--accent); padding: 3px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-family: inherit; cursor: pointer; }
        .perf-badge:hover { background: rgba(147, 112, 219, 0.3); color: #b06fd3; }
        .status-badge { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); color: var(--text-secondary); padding: 3px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; font-family: 'Consolas', 'Menlo', monospace; white-space: nowrap; }
        .status-badge.ok { border-color: rgba(76, 175, 80, 0.45); color: #66bb6a; background: rgba(76, 175, 80, 0.08); }
        .status-badge.warn { border-color: rgba(255, 152, 0, 0.45); color: #ffa726; background: rgba(255, 152, 0, 0.08); }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        /* Boot watchdog overlay - shown when a game fails to start */
        #boot-panel { position: fixed; inset: 0; z-index: 9999; background: rgba(13, 13, 13, 0.92); display: flex; align-items: center; justify-content: center; }
        #boot-panel .panel { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 28px; max-width: 480px; width: calc(100% - 40px); box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        #boot-panel h2 { font-size: 1.05rem; margin-bottom: 8px; color: var(--text-primary); }
        #boot-panel p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5; }
        #boot-panel .phase { font-family: 'Consolas', 'Menlo', monospace; font-size: 0.78rem; color: var(--accent); background: rgba(147,112,219,0.1); border: 1px solid rgba(147,112,219,0.3); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; word-break: break-word; }
        #boot-panel .errors { font-family: 'Consolas', 'Menlo', monospace; font-size: 0.72rem; color: #ff8a80; background: rgba(244,67,54,0.06); border: 1px solid rgba(244,67,54,0.25); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; max-height: 110px; overflow-y: auto; word-break: break-word; white-space: pre-wrap; }
        #boot-panel .btns { display: flex; gap: 10px; flex-wrap: wrap; }
        #boot-panel button { border: none; border-radius: 8px; padding: 10px 16px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; }
        #boot-panel .primary { background: var(--accent); color: #fff; }
        #boot-panel .primary:hover { background: #b06fd3; }
        #boot-panel .secondary { background: var(--bg-primary); color: var(--text-secondary); border: 1px solid var(--border); }
        #boot-panel .secondary:hover { color: var(--text-primary); }
        #game-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; overflow: hidden; }
        #game { width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="nav-left">
            <a href="index.html" class="back-btn">&#8592; Back</a>
            <div class="game-name" id="game-name">Loading...</div>
        </div>
        <div class="nav-right">
            <span class="status-badge" id="fps-badge" title="Emulated frames per second (N64 full speed is 20-30 depending on the game)">-- fps</span>
            <span class="status-badge" id="thread-badge" title="MT = multi-threaded emulation (SharedArrayBuffer active). ST = single-threaded fallback - try Chrome/Edge or a hard refresh.">…</span>
            <button class="perf-badge" id="quality-toggle" title="Switch graphics quality (applies on reload)">Smooth (1x)</button>
        </div>
    </div>
    <div id="game-container">
        <div id="game"></div>
    </div>
    <div id="boot-panel" style="display:none">
        <div class="panel">
            <h2 id="boot-title">This game is taking a while to load</h2>
            <p id="boot-desc">If it never finishes, one of the options below will almost always fix it. Safe Mode switches to the single-threaded emulator core (no worker threads) - slightly lower performance, but loads on every browser.</p>
            <div class="phase" id="boot-phase">Loading\u2026</div>
            <div class="errors" id="boot-errors" style="display:none"></div>
            <div class="btns">
                <button class="primary" id="boot-safe">Safe Mode + Retry</button>
                <button class="secondary" id="boot-clear">Clear Cache + Retry</button>
                <button class="secondary" id="boot-wait">Keep Waiting</button>
            </div>
        </div>
    </div>
    <!-- coi-sw.js: enables crossOriginIsolated (SharedArrayBuffer) via a service
         worker that injects COOP/COEP headers on GitHub Pages. EmulatorJS then
         runs its threaded core (EJS_threads), moving emulation off the main
         thread - the single biggest lag fix. Reloads the page once on the very
         first visit, then the flag in sessionStorage stops further reloads. -->
    <script src="coi-sw.js"></script>
    <script type="text/javascript">
        // ===== INDEXEDDB (for user-uploaded ROMs) =====
        const DB_NAME = 'kantasu_roms_db';
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('games')) database.createObjectStore('games', { keyPath: 'id' });
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function dbGet(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(['games'], 'readonly');
                const req = tx.objectStore('games').get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // ===== CACHING (DO NOT NUKE) =====
        // The old nukeCaches() deleted EmulatorJS-roms / -core / -states on EVERY
        // launch, forcing a full re-download of the emulator core and the entire
        // ROM (up to 234MB) each time a game was opened, and destroying save
        // states. The bugs it worked around (corrupted emulator.min.js) are fixed,
        // so caching is now safe and makes repeat launches near-instant.
        // Manual cache clearing remains available in the emulator's own settings
        // menu (gear icon -> Cache Manager) and in the launcher's Manage tab.

        // ===== MAIN LOADING LOGIC =====
        async function loadGame() {
            var params = new URLSearchParams(window.location.search);
            var romUrl = '';
            var gameName = '';
            var userGameId = params.get('usergame');

            // ===== RELOAD GATE (prevents permanent IndexedDB lockups) =====
            // coi-sw.js sets COI_RELOADING synchronously when this page is
            // about to be replaced by the one-time cross-origin-isolation
            // reload. Starting the emulator (or any IndexedDB work) here
            // would leave databases permanently locked when the reload kills
            // the page mid-transaction - the "games never load again" state.
            // If a reload is coming, wait for it (bounded); if registration
            // fails and no reload happens after all, boot normally.
            if (window.COI_RELOADING === true) {
                document.getElementById('game-name').textContent =
                    (params.get('name') || 'Game') + ' \u2014 preparing...';
                try {
                    await Promise.race([
                        window.COI_DONE,
                        new Promise(function (r) { setTimeout(r, 8000); })
                    ]);
                } catch (e) {}
                if (window.COI_RELOADING === true) return; // reload confirmed
                document.getElementById('game-name').textContent = params.get('name') || 'Game';
            }

            // ===== STORAGE HEALTH PROBE + AUTO-REPAIR =====
            // If a previous session was killed mid-transaction (browser crash,
            // force-close, interrupted reload), the emulator's IndexedDB
            // databases can be stuck in a locked state where open() never
            // resolves. Symptom: every game hangs forever at "Download Game
            // Core" with no error. Probe each database with a timeout BEFORE
            // any storage access; delete-and-recreate the re-downloadable
            // caches (core/roms/bios) automatically. User data (uploaded
            // games, saves, save states) is NEVER auto-deleted - a clear
            // instruction panel is shown instead (verified fix: fully
            // quitting the browser releases the lock).
            // Exact EJS storage layout (verified in emulator.min.js):
            // DB -> object store. The probe MUST create any missing store if
            // it happens to create the database, otherwise EJS would open a
            // store-less database and every transaction would fail.
            // kantasu_roms_db matches the launcher's schema (store 'games',
            // keyPath 'id', launcher upgrades to version 3 itself).
            var EJS_STORES = {
                'EmulatorJS-core': { store: 'core' },
                'EmulatorJS-roms': { store: 'rom' },
                'EmulatorJS-bios': { store: 'bios' },
                'EmulatorJS-states': { store: 'states' },
                '/data/saves': { store: 'FILE_DATA' },      // emscripten IDBFS
                'kantasu_roms_db': { store: 'games', opts: { keyPath: 'id' } }
            };
            function probeDb(name, timeoutMs) {
                return new Promise(function (resolve) {
                    var settled = false;
                    var timer = setTimeout(function () {
                        if (!settled) { settled = true; resolve('blocked'); }
                    }, timeoutMs);
                    try {
                        var rq = indexedDB.open(name);
                        rq.onupgradeneeded = function (e) {
                            // Only fires when creating the DB. Recreate the
                            // exact store EJS/IDBFS expects so a probe-created
                            // database is indistinguishable from EJS's own.
                            try {
                                var db = e.target.result;
                                var spec = EJS_STORES[name];
                                if (spec && spec.store && !db.objectStoreNames.contains(spec.store)) {
                                    db.createObjectStore(spec.store, spec.opts);
                                }
                            } catch (err) {}
                        };
                        rq.onsuccess = function (e) {
                            if (settled) return;
                            settled = true; clearTimeout(timer);
                            try { e.target.result.close(); } catch (err) {}
                            resolve('ok');
                        };
                        rq.onerror = function () {
                            if (settled) return;
                            settled = true; clearTimeout(timer);
                            resolve('error');
                        };
                    } catch (e) {
                        if (!settled) { settled = true; clearTimeout(timer); resolve('error'); }
                    }
                });
            }
            function forceDeleteDb(name, timeoutMs) {
                return new Promise(function (resolve) {
                    var settled = false;
                    var timer = setTimeout(function () {
                        if (!settled) { settled = true; resolve('still-blocked'); }
                    }, timeoutMs);
                    try {
                        var rq = indexedDB.deleteDatabase(name);
                        rq.onsuccess = function () {
                            if (settled) return;
                            settled = true; clearTimeout(timer); resolve('repaired');
                        };
                        rq.onerror = rq.onblocked = function () { /* wait for the timeout */ };
                    } catch (e) {
                        if (!settled) { settled = true; clearTimeout(timer); resolve('still-blocked'); }
                    }
                });
            }
            // Caches re-download automatically -> auto-repairable. User data
            // (uploaded games, saves, save states) -> never auto-deleted.
            var REPAIRABLE = ['EmulatorJS-core', 'EmulatorJS-roms', 'EmulatorJS-bios'];
            var ALL_DBS = Object.keys(EJS_STORES);
            var probeResults = await Promise.all(ALL_DBS.map(function (n) { return probeDb(n, 4000); }));
            var blockedDbs = ALL_DBS.filter(function (n, i) { return probeResults[i] === 'blocked'; });
            if (blockedDbs.length) {
                var repairable = blockedDbs.filter(function (n) { return REPAIRABLE.indexOf(n) !== -1; });
                var dataBlocked = blockedDbs.filter(function (n) { return REPAIRABLE.indexOf(n) === -1; });
                var unrepairable = [];
                if (repairable.length) {
                    var repairs = await Promise.all(repairable.map(function (n) { return forceDeleteDb(n, 5000); }));
                    unrepairable = repairable.filter(function (n, i) { return repairs[i] !== 'repaired'; });
                }
                if (unrepairable.length || dataBlocked.length) {
                    // Storage is locked and cannot be fixed from inside this
                    // page. Tell the player exactly what to do.
                    showStoragePanel(unrepairable.concat(dataBlocked), dataBlocked.length > 0);
                    return;
                }
            }

            if (userGameId) {
                try {
                    await openDB();
                    var gameRecord = await dbGet(userGameId);
                    if (gameRecord && gameRecord.romBlob) {
                        romUrl = URL.createObjectURL(gameRecord.romBlob);
                        gameName = gameRecord.title || 'Game';
                    } else {
                        alert('Game not found in storage!');
                        window.location.href = 'index.html';
                        return;
                    }
                    db.close();
                } catch (err) {
                    alert('Error loading game: ' + err.message);
                    window.location.href = 'index.html';
                    return;
                }
            } else {
                romUrl = params.get('rom') || '';
                gameName = params.get('name') || 'Game';
                if (romUrl && !romUrl.match(/^https?:\/\//)) {
                    romUrl = new URL(romUrl, window.location.href).href;
                }
            }

            document.getElementById('game-name').textContent = gameName;

            // ===== CROSS-ORIGIN ISOLATION READINESS =====
            // coi-sw.js (loaded in <head>) is attempting to enable isolation
            // (service worker injecting COOP/COEP headers + one reload). Await
            // its outcome (bounded) so the correct core build is chosen on the
            // first attempt instead of downloading the single-threaded core
            // and then getting reloaded into the threaded one.
            // Skipped entirely in safe mode - recovery reloads stay clean.
            if (window.COI_DONE && params.get('safe') !== '1') {
                try {
                    await Promise.race([
                        window.COI_DONE,
                        new Promise((resolve) => setTimeout(resolve, 3000))
                    ]);
                } catch (e) { /* never block gameplay on this */ }
            }

            // Determine game type for custom controls
            var gameLower = gameName.toLowerCase();
            var isSM64 = gameLower.includes('mario 64') || gameLower.includes('sm64') || gameLower.includes('super mario');
            var isBanjo = gameLower.includes('banjo');
            var isZelda = gameLower.includes('zelda') || gameLower.includes('ocarina') || gameLower.includes('majora');

            // ===== DEFAULT CONTROLLER MAPPINGS =====
            // See format notes below (EmulatorJS 4.x). Games matching no keyword
            // (e.g. B3313, Dream 64, The Backrooms 64) fall back to EmulatorJS
            // built-in defaults, which load and play fine.

            // EmulatorJS 4.x controls format (REQUIRED, or every launch crashes in setupKeys):
            //   EJS_defaultControls = { 0: { <buttonId>: { value: '<keyName>', value2: '<gamepadLabel>' } }, 1: {}, 2: {}, 3: {} }
            //   - All four players (0-3) must exist (empty objects for 1-3), or setupKeys() throws
            //     'TypeError: Cannot read properties of undefined' and the game never loads.
            //   - 'value'  = keyboard key name (lowercase, per EmulatorJS keyMap: 'c', 'x', 'shift', 'up arrow', ...)
            //   - 'value2' = gamepad label (kept identical to EmulatorJS built-ins so controllers keep working)
            // N64 button IDs: 0=A, 1=B, 3=Start, 4-7=D-Pad, 10=L, 11=R, 12=Z-Trigger,
            //                 16=Stick Right, 17=Stick Left, 18=Stick Down, 19=Stick Up,
            //                 20=C-Right, 21=C-Left, 22=C-Down, 23=C-Up
            if (isSM64) {
                // SM64 Controls:
                // A Button (Jump): C
                // B Button (Punch/Attack): X
                // Z Trigger (Crouch/Ground Pound): Z
                // Movement (Analog Stick): WASD
                // Camera (C-Buttons): IJKL
                // Start: Enter
                window.EJS_defaultControls = {
                    0: {
                        0:  { value: 'c',     value2: 'BUTTON_2' },           // A = C (Jump)
                        1:  { value: 'x',     value2: 'BUTTON_4' },           // B = X (Punch/Attack)
                        2:  { value: 'v',     value2: 'SELECT' },             // (unused on N64)
                        3:  { value: 'enter', value2: 'START' },              // Start
                        4:  { value: 'up arrow',    value2: 'DPAD_UP' },      // D-Pad Up
                        5:  { value: 'down arrow',  value2: 'DPAD_DOWN' },    // D-Pad Down
                        6:  { value: 'left arrow',  value2: 'DPAD_LEFT' },    // D-Pad Left
                        7:  { value: 'right arrow', value2: 'DPAD_RIGHT' },   // D-Pad Right
                        10: { value: 'q', value2: 'LEFT_TOP_SHOULDER' },      // L
                        11: { value: 'e', value2: 'RIGHT_TOP_SHOULDER' },     // R
                        12: { value: 'z', value2: 'LEFT_BOTTOM_SHOULDER' },   // Z = Z (Crouch/Ground Pound)
                        16: { value: 'd', value2: 'LEFT_STICK_X:+1' },        // Stick Right
                        17: { value: 'a', value2: 'LEFT_STICK_X:-1' },        // Stick Left
                        18: { value: 's', value2: 'LEFT_STICK_Y:+1' },        // Stick Down
                        19: { value: 'w', value2: 'LEFT_STICK_Y:-1' },        // Stick Up
                        20: { value: 'l', value2: 'RIGHT_STICK_X:+1' },      // C-Right
                        21: { value: 'j', value2: 'RIGHT_STICK_X:-1' },      // C-Left
                        22: { value: 'k', value2: 'RIGHT_STICK_Y:+1' },      // C-Down
                        23: { value: 'i', value2: 'RIGHT_STICK_Y:-1' }       // C-Up
                    },
                    1: {}, 2: {}, 3: {}
                };
            } else if (isBanjo) {
                // Banjo-Kazooie Controls:
                // A Button (Jump): Z
                // B Button (Attack/Hit): X
                // Z Trigger (Crouch/Roll): C
                // Movement (Analog Stick): WASD
                // C-Buttons (Camera/Eggs): IJKL
                // L/R: Q and E
                // Start: Enter
                window.EJS_defaultControls = {
                    0: {
                        0:  { value: 'z',     value2: 'BUTTON_2' },           // A = Z (Jump)
                        1:  { value: 'x',     value2: 'BUTTON_4' },           // B = X (Attack)
                        2:  { value: 'v',     value2: 'SELECT' },             // (unused on N64)
                        3:  { value: 'enter', value2: 'START' },              // Start
                        4:  { value: 'up arrow',    value2: 'DPAD_UP' },      // D-Pad Up
                        5:  { value: 'down arrow',  value2: 'DPAD_DOWN' },    // D-Pad Down
                        6:  { value: 'left arrow',  value2: 'DPAD_LEFT' },    // D-Pad Left
                        7:  { value: 'right arrow', value2: 'DPAD_RIGHT' },   // D-Pad Right
                        10: { value: 'q', value2: 'LEFT_TOP_SHOULDER' },      // L
                        11: { value: 'e', value2: 'RIGHT_TOP_SHOULDER' },     // R
                        12: { value: 'c', value2: 'LEFT_BOTTOM_SHOULDER' },   // Z = C (Crouch/Roll)
                        16: { value: 'd', value2: 'LEFT_STICK_X:+1' },        // Stick Right
                        17: { value: 'a', value2: 'LEFT_STICK_X:-1' },        // Stick Left
                        18: { value: 's', value2: 'LEFT_STICK_Y:+1' },        // Stick Down
                        19: { value: 'w', value2: 'LEFT_STICK_Y:-1' },        // Stick Up
                        20: { value: 'l', value2: 'RIGHT_STICK_X:+1' },      // C-Right
                        21: { value: 'j', value2: 'RIGHT_STICK_X:-1' },      // C-Left
                        22: { value: 'k', value2: 'RIGHT_STICK_Y:+1' },      // C-Down
                        23: { value: 'i', value2: 'RIGHT_STICK_Y:-1' }       // C-Up
                    },
                    1: {}, 2: {}, 3: {}
                };
            } else if (isZelda) {
                // Zelda Controls:
                // A Button (Action/Talk/Confirm): Z
                // B Button (Sword/Attack): X
                // Z-Targeting (Shield/Lock-on): Left Shift
                // Movement (Analog Stick): Arrow Keys
                // C-Left/Right/Down: A, S, D
                // C-Up (First-Person/Navi): W
                // Start: Enter
                window.EJS_defaultControls = {
                    0: {
                        0:  { value: 'z',     value2: 'BUTTON_2' },           // A = Z (Action/Talk)
                        1:  { value: 'x',     value2: 'BUTTON_4' },           // B = X (Sword/Attack)
                        2:  { value: 'v',     value2: 'SELECT' },             // (unused on N64)
                        3:  { value: 'enter', value2: 'START' },              // Start
                        4:  { value: 'up arrow',    value2: 'DPAD_UP' },      // D-Pad Up
                        5:  { value: 'down arrow',  value2: 'DPAD_DOWN' },    // D-Pad Down
                        6:  { value: 'left arrow',  value2: 'DPAD_LEFT' },    // D-Pad Left
                        7:  { value: 'right arrow', value2: 'DPAD_RIGHT' },   // D-Pad Right
                        10: { value: 'q', value2: 'LEFT_TOP_SHOULDER' },      // L
                        11: { value: 'e', value2: 'RIGHT_TOP_SHOULDER' },     // R
                        12: { value: 'shift', value2: 'LEFT_BOTTOM_SHOULDER' }, // Z-Target = Left Shift
                        16: { value: 'right arrow', value2: 'LEFT_STICK_X:+1' }, // Stick Right
                        17: { value: 'left arrow',  value2: 'LEFT_STICK_X:-1' }, // Stick Left
                        18: { value: 'down arrow',  value2: 'LEFT_STICK_Y:+1' }, // Stick Down
                        19: { value: 'up arrow',    value2: 'LEFT_STICK_Y:-1' }, // Stick Up
                        20: { value: 's', value2: 'RIGHT_STICK_X:+1' },      // C-Right
                        21: { value: 'a', value2: 'RIGHT_STICK_X:-1' },      // C-Left
                        22: { value: 'd', value2: 'RIGHT_STICK_Y:+1' },      // C-Down
                        23: { value: 'w', value2: 'RIGHT_STICK_Y:-1' }       // C-Up (Navi/First Person)
                    },
                    1: {}, 2: {}, 3: {}
                };
            }

            // ===== EMULATOR CONFIG =====
            EJS_player = '#game';
            EJS_core = 'mupen64plus_next';
            EJS_gameUrl = romUrl;
            EJS_gameName = gameName;
            EJS_pathtodata = 'data/';
            EJS_startOnLoaded = true;
            EJS_volume = 1;
            EJS_AdUrl = '';
            EJS_color = '#9370db';
            EJS_disableAutoLang = true;
            EJS_language = 'en-US';

            // ===== THREADED EMULATION (the big one) =====
            // coi-sw.js (loaded above) makes this page cross-origin isolated,
            // which unlocks SharedArrayBuffer. With EJS_threads = true,
            // EmulatorJS loads the pthreads build of the mupen64plus_next core
            // and the N64 emulation loop runs on a real worker thread:
            //   - Emulation no longer freezes/stalls the browser UI
            //   - Input, audio and rendering stop competing with the CPU core
            //   - GlideN64 video + RSP can overlap with R4300i CPU emulation
            // On browsers/sessions where isolation is unavailable (e.g. Safari
            // without COEP support, or SW failure) this evaluates to false and
            // the normal single-threaded core is used - never breaks, just
            // falls back.
            //
            // SAFE MODE (?safe=1 or the boot watchdog panel): forces the
            // single-threaded core even when isolation is available. Covers
            // environments where worker/SAB/COI itself is the thing that's
            // broken (over-aggressive extensions, odd browser builds). Sticks
            // in localStorage until disabled from the boot panel.
            var SAFE = false;
            try {
                SAFE = (params.get('safe') === '1') ||
                       (params.get('safe') !== '0' && localStorage.getItem('kantasu_safe_mode') === '1');
            } catch (e) {}
            window.EJS_threads = !SAFE && (window.crossOriginIsolated === true);

            // ===== STATUS BADGES (fps + threading diagnostics) =====
            // The fps badge polls the emulator's real frame counter once per
            // second (cheap cwrap call) so players can SEE the effect of the
            // quality toggle. The thread badge verifies actual multithreading
            // by checking the emscripten heap type at runtime - not just the
            // config flag - so "MT" guarantees the pthread core is live.
            var threadBadge = document.getElementById('thread-badge');
            var fpsBadge = document.getElementById('fps-badge');
            if (threadBadge) {
                threadBadge.textContent = window.EJS_threads ? 'MT' : (SAFE ? 'ST (safe)' : 'ST');
                threadBadge.className = 'status-badge ' + (window.EJS_threads ? 'ok' : 'warn');
            }

            // ===== BOOT WATCHDOG + ERROR CAPTURE =====
            // Games should start in well under 45 seconds even on a cold
            // cache (core 1.5MB + ROM up to ~64MB on GitHub Pages CDN). If a
            // game silently stalls - broken worker/COI environment, poisoned
            // IndexedDB cache, network hiccup - nothing tells the player why.
            // This watchdog surfaces the stall, shows exactly WHERE boot is
            // stuck plus any captured console errors, and offers one-click
            // recovery: Safe Mode (single-threaded core) or a cache reset.
            var bootErrors = [];
            window.addEventListener('error', function (e) {
                if (bootErrors.length < 8) bootErrors.push(
                    (e && e.message ? e.message : 'Script error') +
                    (e && e.lineno ? ' (line ' + e.lineno + ')' : ''));
            });
            window.addEventListener('unhandledrejection', function (e) {
                if (bootErrors.length < 8) bootErrors.push('Promise: ' +
                    (e && e.reason && e.reason.message ? e.reason.message : String(e && e.reason || 'rejection')));
            });
            var bootStart = Date.now();
            var bootPanelShown = false;
            function showBootPanel() {
                if (bootPanelShown) return;
                bootPanelShown = true;
                var panel = document.getElementById('boot-panel');
                if (!panel) return;
                // Reflect the emulator's own loading phase ("Download Game
                // Core 42%", "Loading...", stuck blank, etc.)
                var phaseText = '';
                try {
                    var g = document.getElementById('game');
                    if (g) phaseText = (g.innerText || '').trim().split('\n')[0].substring(0, 120);
                } catch (e) {}
                var phaseEl = document.getElementById('boot-phase');
                if (phaseEl) phaseEl.textContent = phaseText || 'Loading\u2026 (no visible progress)';
                // Show captured errors, if any
                var errEl = document.getElementById('boot-errors');
                if (errEl && bootErrors.length) {
                    errEl.style.display = 'block';
                    errEl.textContent = bootErrors.join('\n');
                }
                // In safe mode already -> adapt the copy + offer to leave it
                var title = document.getElementById('boot-title');
                var desc = document.getElementById('boot-desc');
                var safeBtn = document.getElementById('boot-safe');
                if (SAFE && title && desc && safeBtn) {
                    title.textContent = 'This game still will not load';
                    desc.textContent = 'Safe Mode (single-threaded) is already active. If the game still does not start, clearing the emulator cache forces a clean re-download of the core and ROM data. Your saves are not touched.';
                    safeBtn.style.display = 'none';
                }
                panel.style.display = 'flex';
                // Wire the recovery buttons
                var safeAction = document.getElementById('boot-safe');
                if (safeAction) safeAction.onclick = function () {
                    try { localStorage.setItem('kantasu_safe_mode', '1'); } catch (e) {}
                    location.reload();
                };
                var clearAction = document.getElementById('boot-clear');
                if (clearAction) clearAction.onclick = function () {
                    // Delete ONLY the core + rom download caches. Save data
                    // (/data/saves IDBFS) and save states are other databases
                    // and are never touched.
                    ['EmulatorJS-core', 'EmulatorJS-roms'].forEach(function (name) {
                        try { indexedDB.deleteDatabase(name); } catch (e) {}
                    });
                    location.reload();
                };
                var waitAction = document.getElementById('boot-wait');
                if (waitAction) waitAction.onclick = function () {
                    bootPanelShown = false;
                    panel.style.display = 'none';
                    // Re-arm the watchdog with a longer fuse (2 min)
                    bootStart = Date.now() - (120000 - 90000);
                };
            }
            // Storage-lock panel: the emulator's IndexedDB is stuck (usually
            // after a crash / force-close during a save or download). This
            // cannot be repaired from inside the page - but fully closing the
            // browser releases the lock (verified). Say exactly that.
            function showStoragePanel(stuckDbs, savesAtRisk) {
                var panel = document.getElementById('boot-panel');
                if (!panel) { alert('The emulator storage is locked. Fully close your browser (all windows) and reopen this page.'); return; }
                var title = document.getElementById('boot-title');
                var desc = document.getElementById('boot-desc');
                var phase = document.getElementById('boot-phase');
                if (title) title.textContent = 'Emulator storage is locked';
                if (desc) desc.textContent =
                    'A previous session was interrupted while writing to the emulator\u2019s storage, and the browser kept it locked. ' +
                    'To fix it: fully QUIT the browser (all windows, not just this tab), then reopen this page \u2014 the lock releases and games load again. ' +
                    (savesAtRisk
                        ? 'The save-data database is affected. Your saves are not lost \u2014 after restarting, if saves do not appear, use the site\u2019s Manage tab to re-import them.'
                        : 'Your saves are safe \u2014 only the re-downloadable core/ROM caches were affected.');
                if (phase) phase.textContent = 'Locked: ' + (stuckDbs.length ? stuckDbs.join(', ') : '/data/saves');
                var safeBtn = document.getElementById('boot-safe');
                if (safeBtn) safeBtn.style.display = 'none';
                var waitBtn = document.getElementById('boot-wait');
                if (waitBtn) waitBtn.style.display = 'none';
                var clearBtn = document.getElementById('boot-clear');
                if (clearBtn) {
                    clearBtn.textContent = 'I Restarted \u2014 Retry Now';
                    clearBtn.className = 'primary';
                    clearBtn.onclick = function () { location.reload(); };
                }
                panel.style.display = 'flex';
            }

            // Debug handle - also lets anyone inspect boot state from console
            window.KANTASU_BOOT = {
                errors: bootErrors,
                showPanel: showBootPanel,
                showStoragePanel: showStoragePanel,
                probeDb: probeDb,
                forceDeleteDb: forceDeleteDb,
                started: function () {
                    try { return !!(window.EJS_emulator && EJS_emulator.started); } catch (e) { return false; }
                },
                safe: SAFE
            };
            var bootTimer = setInterval(function () {
                var started = false;
                try { started = window.EJS_emulator && EJS_emulator.started; } catch (e) { started = false; }
                if (started) { clearInterval(bootTimer); return; }
                if (Date.now() - bootStart > 45000) {
                    clearInterval(bootTimer);
                    showBootPanel();
                }
            }, 2000);

            window.EJS_ready = function () {
                // Confirm multithreading against the real heap (not just config).
                // Module.HEAPU8 may not exist yet at the exact 'ready' moment,
                // so retry briefly instead of concluding 'ST' too early.
                var heapVerified = false;
                var heapTries = 0;
                function checkHeap() {
                    if (heapVerified || heapTries++ > 30) return; // give up after ~15s
                    try {
                        var heap = window.EJS_emulator && EJS_emulator.gameManager &&
                                   EJS_emulator.gameManager.Module && EJS_emulator.gameManager.Module.HEAPU8;
                        if (heap && heap.buffer) {
                            heapVerified = true;
                            var reallyThreaded = heap.buffer.constructor &&
                                                 heap.buffer.constructor.name === 'SharedArrayBuffer';
                            if (threadBadge) {
                                threadBadge.textContent = reallyThreaded ? 'MT' : 'ST';
                                threadBadge.className = 'status-badge ' + (reallyThreaded ? 'ok' : 'warn');
                            }
                        }
                    } catch (e) {}
                }
                // Live fps readout from the core's own frame counter
                var lastFrame = null, lastTime = null;
                setInterval(function () {
                    checkHeap();
                    try {
                        if (!window.EJS_emulator || !EJS_emulator.started ||
                            !EJS_emulator.gameManager) return;
                        var f = EJS_emulator.gameManager.getFrameNum();
                        var now = performance.now();
                        if (lastFrame !== null && now > lastTime) {
                            var fps = (f - lastFrame) / ((now - lastTime) / 1000);
                            if (fpsBadge && isFinite(fps)) {
                                fpsBadge.textContent = Math.max(0, Math.round(fps)) + ' fps';
                                fpsBadge.className = 'status-badge ' + (fps >= 19 ? 'ok' : 'warn');
                            }
                        }
                        lastFrame = f; lastTime = now;
                    } catch (e) {}
                }, 1000);
            };

            // ===== QUALITY MODE (Smooth / Sharp) =====
            // Smooth: native 320x240 internal resolution + no per-pixel HW
            //   lighting - 4x fewer pixels to rasterize. The fix for weak /
            //   integrated / software GPUs where high resolution causes lag.
            // Sharp: 2x (640x480) resolution + per-pixel HW lighting - the
            //   best-looking option for capable GPUs.
            // Both modes keep every pure-speed option below (fastest CPU
            // core, HLE RSP, no framebuffer readbacks, frame duping), so
            // Smooth only trades *graphics fidelity* for headroom.
            // Persisted in localStorage, overridable per-launch via
            // ?mode=smooth or ?mode=sharp.
            //
            // Smooth is the DEFAULT now: 3D scenes stay at full speed on weak
            // or integrated GPUs. The old default (Sharp = 640x480 + per-pixel
            // lighting) caused ~17fps in 3D scenes on machines that can't
            // push that load. One-time migration (kantasu_quality_v2 flag)
            // resets visitors who had Sharp saved *by the old default* -
            // after this, whatever is picked in the toggle sticks forever.
            var savedMode = null;
            try { savedMode = localStorage.getItem('kantasu_quality_mode'); } catch (e) {}
            var migrated = false;
            try { migrated = localStorage.getItem('kantasu_quality_v2') === '1'; } catch (e) {}
            if (!migrated) {
                // First visit on the new build: forget the old default and
                // remember that this migration ran (explicit ?mode= URL
                // params still win over everything below).
                savedMode = null;
                try { localStorage.setItem('kantasu_quality_v2', '1'); } catch (e) {}
            }
            var modeParam = params.get('mode');
            var MODE = (modeParam === 'smooth' || modeParam === 'sharp') ? modeParam
                     : (savedMode === 'smooth' || savedMode === 'sharp') ? savedMode
                     : 'smooth';
            var SMOOTH = (MODE === 'smooth');
            try { localStorage.setItem('kantasu_quality_mode', MODE); } catch (e) {}
            var qToggle = document.getElementById('quality-toggle');
            if (qToggle) {
                qToggle.textContent = SMOOTH ? 'Smooth (1x)' : 'Sharp (2x)';
                qToggle.addEventListener('click', function () {
                    var next = SMOOTH ? 'sharp' : 'smooth';
                    try { localStorage.setItem('kantasu_quality_mode', next); } catch (e) {}
                    // Update the ?mode= param too, otherwise a stale URL
                    // parameter would override the toggle after the reload.
                    var u = new URL(window.location.href);
                    u.searchParams.set('mode', next);
                    window.location.href = u.href;
                });
            }

            // ENABLE local save data (auto-saves to IndexedDB)
            // 2GB cache limit so every built-in ROM (~700MB total) + the emulator
            // core stays cached in IndexedDB between sessions (default was 500MB).
            EJS_CacheLimit = 2147483648;
            EJS_disableLocalStorage = false;

            // Disable cheats entirely (prevents memory access out of bounds crash)
            EJS_cheats = [];

            // ===== PERFORMANCE + QUALITY OPTIONS =====
            // These are the REAL mupen64plus-next core options (verified against
            // the core binary shipped with EmulatorJS 4.2.3 and A/B tested in
            // the browser). Pure-speed settings apply in BOTH quality modes:
            //  - cpucore 'cached_interpreter': fastest CPU core in WASM builds
            //    (dynamic recompilation is impossible in the browser).
            //  - rsp-plugin 'hle': high-level RSP emulation (fastest, default).
            //  - EnableCopyColorToRDRAM/DepthToRDRAM 'Off': the defaults
            //    ('Sync'/'Software') force GPU->CPU framebuffer readbacks that
            //    stall rendering every frame - the main source of in-game lag
            //    and audio crackle.
            //  - FrameDuping 'True': when the game hasn't rendered a new frame
            //    (menus, pauses, load screens), the previous frame is reused
            //    instead of re-submitting the whole scene - measurably the
            //    best-performing configuration in browser testing.
            // Quality-dependent settings (resolution, HW lighting) follow the
            // Smooth/Sharp mode selected above.
            EJS_defaultOptions = {
                // CPU - fastest available core
                'mupen64plus-cpucore': 'cached_interpreter',
                // RSP - HLE (only + fastest option in WASM builds)
                'mupen64plus-rsp-plugin': 'hle',
                // GlideN64 renders on its own thread (needs the pthread core
                // build - silently ignored by the single-threaded fallback)
                'mupen64plus-ThreadedRenderer': 'True',
                // Rendering (mode-dependent)
                'mupen64plus-43screensize': SMOOTH ? '320x240' : '640x480',
                'mupen64plus-aspect': '4:3',
                'mupen64plus-EnableNativeResFactor': '0',
                'mupen64plus-BilinearMode': '3point',
                'mupen64plus-EnableHWLighting': SMOOTH ? 'False' : 'True',
                // Framebuffer readbacks OFF (the big lag fix)
                'mupen64plus-EnableFBEmulation': 'True',
                'mupen64plus-EnableCopyColorToRDRAM': 'Off',
                'mupen64plus-EnableCopyDepthToRDRAM': 'Off',
                'mupen64plus-EnableCopyAuxToRDRAM': 'False',
                'mupen64plus-EnableCopyColorFromRDRAM': 'False',
                // Frame pacing
                'mupen64plus-Framerate': 'Original',
                'mupen64plus-FrameDuping': 'True',
                // Texture handling
                'mupen64plus-EnableTextureCache': 'True',
                'mupen64plus-MaxTxCacheSize': '8000',
                'mupen64plus-EnableLegacyBlending': 'True'
            };

            EJS_debug = false;

            // Load emulator with cache-busting
            var script = document.createElement('script');
            script.src = 'data/loader.js?v=' + Date.now();
            document.body.appendChild(script);
        }

        loadGame();
    </script>
</body>
</html>
